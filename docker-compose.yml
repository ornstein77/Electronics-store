services:
  todoapp-postgres:
    image: postgres:18.4-bookworm
    container_name: todoapp-env-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./out/pggdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  todoapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      todoapp-postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: [migrate, -path, /migrations, -database, 'postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@todoapp-postgres:5432/${POSTGRES_DB}?sslmode=disable']
    command: [up]
  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todoapp-postgres-port-forwarder
    depends_on:
      todoapp-postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:5433:5432'
    command: TCP-LISTEN:5432,fork,reuseaddr TCP:todoapp-postgres:5432
  swagger:
    profiles: [tools]
    build:
      context: ./
      dockerfile_inline: |
        FROM golang:1.25.5-alpine
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /app
        ENTRYPOINT ["swag"]
    volumes:
      - ./:/app
    command: [init, -g, cmd/app/main.go, -o, docs, --parseInternal]
